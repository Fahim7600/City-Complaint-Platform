# This service is configured manually in the Render dashboard; this file documents the settings.
services:
  - type: web
    name: city-complaint-platform
    runtime: node
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: DEMO_USERS_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        sync: false
      - key: JWT_REFRESH_EXPIRY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PREMIUM_PRICE_ID
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false